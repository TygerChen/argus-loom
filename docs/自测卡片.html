<script>
const DATA = [{"q": "Q1：`==` 和 `equals` 的区别？", "a": "`==` 比较的是&quot;是不是同一个东西&quot;（基本类型比值，对象比内存地址）；`equals` 比较的是&quot;内容是否相等&quot;（前提是类重写了它）。<br>类比：`==` 问&quot;是同一张身份证吗&quot;，`equals` 问&quot;长得一样吗&quot;。<br>挂钩：判定两个用户是否同一个人用 ID（`==`），比对内容用 equals——我项目里统一用 ID 定位用户，从不靠内容判断身份。<br>追问：为什么重写 equals 必须重写 hashCode？→ 因为 HashMap 先比 hashCode 定位桶、再比 equals；不重写会导致&quot;内容相等的两个对象进不同的桶&quot;，查不到。", "cat": "八股·Java"}, {"q": "Q2：String 为什么设计成不可变？", "a": "三个理由：①字符串常量池复用（相同字符串全 JVM 只存一份）；②线程安全（不可变对象天然线程安全）；③hashCode 可以缓存（String 大量用作 HashMap 的 key）。<br>类比：身份证号终身不变，才能当唯一凭证到处用。<br>追问：大量字符串拼接为什么用 StringBuilder？→ String 拼接每次都新建对象，StringBuilder 在内部数组上追加，省掉 N 个中间对象。", "cat": "八股·Java"}, {"q": "Q3：接口和抽象类的区别？怎么选？", "a": "抽象类是&quot;是什么&quot;（单继承，可以存状态和具体实现）；接口是&quot;能做什么&quot;（多实现，方法默认抽象，Java 8 后可以有 default 方法）。<br>类比：抽象类是&quot;血缘&quot;（你只能有一个爹），接口是&quot;技能证书&quot;（你可以考无数本）。<br>挂钩：我的权限体系用接口定义能力（谁能审谁），用抽象类沉淀公共流程。<br>追问：Java 8 接口的 default 方法解决了什么？→ 接口升级时不破坏已有实现类。", "cat": "八股·Java"}, {"q": "Q4：Java 的异常体系？", "a": "Throwable 下分 Error（系统级，程序别管，如 OOM）和 Exception；Exception 分受检（编译器强制 try/catch，如 IOException）和非受检（RuntimeException，如 NPE）。<br>类比：Error=天灾，受检异常=明文规定的必修考试，非受检=日常磕碰。<br>追问：你们项目异常怎么设计的？→ 全局异常处理器统一转 ApiResponse；业务失败返回业务错误码而不是 500；SSE 流单独处理（中途断开要通知前端）。", "cat": "八股·Java"}, {"q": "Q5：反射是什么？什么场景用？", "a": "运行时动态获取类信息、调用方法、改字段的能力。框架的基石：Spring 的 IOC、MyBatis 的 Mapper 都是反射实现的。<br>类比：正常做事要&quot;认识本人&quot;，反射是&quot;拿着名单也能安排工作&quot;。<br>挂钩：Flyway 迁移、Spring 配置绑定背后全是反射——我用反射做过通用测试构造（TableInfoHelper 初始化 MyBatis-Plus 元数据）。<br>追问：反射慢在哪？→ 无法 JIT 深度优化+查表开销；框架会用缓存 Method 对象缓解。", "cat": "八股·Java"}, {"q": "Q6：final / finally / finalize？", "a": "final=不可变（类不可继承/方法不可重写/变量不可重新赋值）；finally=try 块后必执行（释放资源）；finalize=对象被回收前的钩子（已废弃，别用）。<br>一句话答完即可，追问方向：finally 一定执行吗？→ 除 `System.exit` 和 JVM 崩溃外都执行。<br><br><b>B. 集合框架</b>", "cat": "八股·Java"}, {"q": "Q7：ArrayList 和 LinkedList 的区别？", "a": "ArrayList 底层数组，随机访问 O(1)，中间插删要挪元素 O(n)；LinkedList 双向链表，头尾插删 O(1)，随机访问 O(n)。<br>类比：数组=电影院排号座位（找第 5 排快，插座要全排挪），链表=寻宝游戏线索卡（插一张容易，找第 50 张要从头翻）。<br>追问：实际开发几乎都用 ArrayList，为什么？→ CPU 缓存对连续内存友好+真实场景随机读多；LinkedList 还额外费内存（每节点两个指针）。", "cat": "八股·Java"}, {"q": "Q8：HashMap 的底层原理？（必考 Top3）", "a": "数组+链表+红黑树（JDK8+）：put 时对 key 的 hashCode 做扰动后按容量取模定位桶；冲突就挂链表；链表长度 ≥8 且数组长度 ≥64 转红黑树（查询从 O(n) 到 O(logn)）；元素数超过 容量×负载因子(0.75) 扩容为 2 倍并重新分配。<br>类比：图书馆按书名首字母分书架（桶），同架的书排成串，太长了就改用排序柜。<br>挂钩：追问&quot;为什么容量是 2 的幂&quot;→ 取模可以用位运算 (&amp; n-1) 替代除法，快。<br>追问：多线程用 HashMap 会怎样？→ JDK7 头插扩容可能成环死循环；JDK8 修了环但仍会丢数据——并发用 ConcurrentHashMap。", "cat": "八股·Java"}, {"q": "Q9：ConcurrentHashMap 怎么保证线程安全？", "a": "JDK8 抛弃分段锁，改为 CAS + synchronized 锁单个桶头节点：无冲突用 CAS 插入，冲突才锁该桶——锁粒度从&quot;段&quot;细化到&quot;桶&quot;。<br>类比：以前锁整层楼，现在只锁正被使用的柜子。<br>追问：key 能为 null 吗？→ 不能（无法区分&quot;不存在&quot;和&quot;值为 null&quot;），HashMap 可以。", "cat": "八股·Java"}, {"q": "Q10：ArrayList 线程不安全，怎么选安全的？", "a": "读多写少用 CopyOnWriteArrayList（写时复制整个数组，读无锁）；高并发写用 Collections.synchronizedList 或手动同步；键值场景用 ConcurrentHashMap。<br>追问：CopyOnWrite 为什么读快写慢？→ 每次写复制全数组，适合&quot;配置类&quot;读极多写极少。<br><br><b>C. 并发编程（重点）</b>", "cat": "八股·Java"}, {"q": "Q11：线程和进程的区别？创建线程的方式？", "a": "进程=资源分配单位（一个运行的程序），线程=CPU 调度单位（程序里的一条执行流），同进程线程共享内存。<br>创建：①实现 Runnable/Callable 传给 Thread（推荐，任务与线程解耦）②继承 Thread③线程池提交（实际开发的正解）。<br>追问：start 和 run 的区别？→ run() 是普通方法调用（单线程跑），start() 才真正开新线程。", "cat": "八股·Java"}, {"q": "Q12：synchronized 和 ReentrantLock 的区别？（必考）", "a": "synchronized 是 JVM 关键字，自动加锁释放锁；ReentrantLock 是 API 级锁，手动 lock/unlock（必须在 finally 释放），但功能更强：可尝试获取（tryLock 不死等）、可超时、可中断、公平锁、多条件变量 Condition。<br>类比：synchronized=卫生间自动锁门自动开；ReentrantLock=带预约/超时/插队规则的智能门锁。<br>追问：synchronized 锁的是什么？→ 修饰实例方法锁 this，静态方法锁 Class 对象，代码块锁指定对象。", "cat": "八股·Java"}, {"q": "Q13：volatile 是干什么的？", "a": "两个语义：①可见性——一个线程改了，其他线程立刻看到（禁用该变量的 CPU 缓存不一致）；②禁止指令重排。<b>不保证原子性</b>（i++ 依然会丢更新）。<br>类比：volatile 是&quot;群公告&quot;（人人立刻看到），但两个人同时改公告还是会覆盖。<br>追问：什么场景用？→ 一写多读的状态标志位（如&quot;是否关闭&quot;开关）。要原子性就上 AtomicInteger（CAS）。", "cat": "八股·Java"}, {"q": "Q14：线程池的核心参数和执行流程？（必考 Top3，你项目里真用了）", "a": "七个参数：核心线程数、最大线程数、空闲存活时间、时间单位、<b>工作队列</b>、线程工厂、<b>拒绝策略</b>。<br>执行流程：核心线程没满→开核心线程；满了→任务进<b>队列</b>；队列满→开到最大线程；再满→触发<b>拒绝策略</b>（ Abort 抛异常/CallerRuns 调用者自己跑/Discard 丢弃/DiscardOldest）。<br>类比：餐厅 5 个正式厨师（核心），爆单先排队（队列），队满了叫临时工（扩到最大），连临时工都满了就拒接（拒绝策略）。<br><b>项目挂钩（强）</b>：Excel 导出有专用 `excelExportExecutor`，拒绝策略用 CallerRuns——&quot;导出请求太多时，宁可提交线程自己慢慢算，也不丢用户任务&quot;；队列有界，防止任务无限堆积拖垮内存。<br>追问：为什么不用 Executors.newFixedThreadPool？→ 它的队列无界，任务堆积会 OOM；《阿里 Java 开发手册》强制手动 new ThreadPoolExecutor（出处：阿里手册第二章，p3c 开源仓库）。", "cat": "八股·Java"}, {"q": "Q15：ThreadLocal 是什么？坑在哪？", "a": "线程本地变量：每个线程一份独立副本，互不干扰（经典场景：存当前登录用户、数据库连接）。<br>坑：线程池里线程复用，用完不 remove 会把上个请求的数据&quot;串&quot;给下个请求——<b>必须 finally 里 remove</b>。<br>类比：健身房储物柜（每人一格），但柜子是循环使用的，走人不清空就是事故。<br>追问：内存泄漏怎么发生的？→ ThreadLocalMap 的 key 是弱引用被回收后 value 还挂着，靠 remove 显式清理。", "cat": "八股·Java"}, {"q": "Q16：CAS 是什么？AQS 听过吗？", "a": "CAS=Compare And Swap：更新前比对&quot;内存里的值还是我读到的那个值吗&quot;，是才改——乐观锁的硬件级实现（Atomic 类的底层）。缺点：ABA 问题（可用版本号解决，如 AtomicStampedReference）。<br>AQS=抽象队列同步器，ReentrantLock/Semaphore/CountDownLatch 的共同底座：一个 state 变量+一个 CLH 等待队列。<br>一句话级别的理解即可，被深追就答&quot;知道是 JUC 的底座，state+队列，具体实现读过部分源码&quot;——诚实边界。", "cat": "八股·Java"}, {"q": "Q17：死锁产生的四个条件？怎么排查？", "a": "互斥、持有并等待、不可剥夺、循环等待。破坏任意一个即可预防（最常用：全局固定的加锁顺序）。<br>排查：jstack 打印线程栈看 &quot;Found one Java-level deadlock&quot;；项目里可通过健康检查页看到线程池状态。<br>追问：你项目里会死锁吗？→ 任务用 SKIP LOCKED（数据库层不等待），应用层锁只有单把，风险低。", "cat": "八股·Java"}, {"q": "Q18：怎么安全地停止一个线程？", "a": "不用 stop()（已废弃，会破坏数据）。用<b>中断标志</b>：volatile 的 boolean 开关（如&quot;是否关闭&quot;）+ 循环里检查；或 Thread.interrupt() + 响应 InterruptedException。<br>挂钩：我的 ETL worker 就是这么停的——停机时正在处理的任务靠幂等+租约回收，不会丢。<br><br><b>D. JVM</b>", "cat": "八股·Java"}, {"q": "Q19：JVM 内存区域分哪几块？", "a": "线程私有：程序计数器、虚拟机栈（方法调用帧，StackOverflowError 在这）、本地方法栈。线程共享：堆（对象实例，GC 主战场，OOM 在这）、方法区/元空间（类信息、常量池）。<br>类比：栈=每人的记事本（调用一层记一页），堆=公共仓库。<br>追问：StackOverflowError 和 OOM 的区别？→ 前者栈满（递归太深），后者堆满（对象太多）。", "cat": "八股·Java"}, {"q": "Q20：垃圾回收怎么判断对象该死？", "a": "可达性分析：从 GC Roots（栈引用、静态变量、常量等）出发，摸不到的就是垃圾。不是引用计数（解决不了循环引用）。<br>追问：四种引用？→ 强（永不回收）、软（内存不足才回收，适合缓存）、弱（下次 GC 必回收，ThreadLocalMap 的 key）、虚（仅用于回收通知）。", "cat": "八股·Java"}, {"q": "Q21：分代收集是怎么回事？", "a": "堆分新生代（Eden+两个 Survivor）和老年代。对象先在 Eden 出生，熬过几次Minor GC 进老年代——依据是&quot;大部分对象朝生夕死&quot;。<br>类比：新员工先在试用期（Eden），转正多次（熬过 GC）进正式编制（老年代）。<br>追问：什么对象直接进老年代？→ 大对象和长期存活的对象。<br>追问：Full GC 频繁怎么排查？→ jstat 看各代变化、dump 堆分析（MAT/JProfiler）找大对象来源。", "cat": "八股·Java"}, {"q": "Q22：常见的垃圾回收器？", "a": "一句话级：Serial（单线程，客户端）、Parallel（吞吐优先，批处理）、CMS（已废弃）、<b>G1（JDK9+ 默认，分 Region、可预测停顿）</b>、ZGC（超低停顿，JDK21 生产可用）。<br>挂钩：我用的 JDK 21 默认 G1，虚拟线程（JDK21 新特性）也是我技术栈的一部分——这在&quot;为什么用 JDK21&quot;追问里是加分点。", "cat": "八股·Java"}, {"q": "Q23：线上 OOM/内存高怎么排查？（结合项目实例答）", "a": "步骤：①健康检查页/监控先看趋势（我的系统总览有内存用量提示——Chrome 标签都显示过&quot;内存用量高 814MB&quot;这种，说明可观测意识贯穿）②jmap dump 堆 ③MAT/JProfiler 看大对象 dominator tree ④定位到代码（常见：无界集合、连接未释放、缓存无淘汰）。<br>类比：先看仪表盘，再抽血化验（dump），最后读报告（分析工具）。<br><br><b>E. 场景与陷阱（锦上添花）</b>", "cat": "八股·Java"}, {"q": "Q24：接口幂等有哪些实现方式？（和你的项目强挂钩）", "a": "①唯一索引/唯一键兜底 ②幂等键（客户端生成，服务端查重）③先查后写+条件更新（版本号/状态机）④分布式锁兜底并发。<br><b>项目挂钩</b>：我的任务队列就是&quot;幂等三重保障&quot;——先清后建+确定性 UUID+幂等键；同键重传自动复活死信任务。<br>追问：先查后写在并发下为什么不安全？→ 两个请求同时查都没查到，然后都写——所以数据库唯一索引是最后防线。", "cat": "八股·Java"}, {"q": "Q25：乐观锁和悲观锁？", "a": "悲观锁=先锁再操作（select for update），适合写多；乐观锁=更新时带版本号条件（where version=x），失败重试，适合读多。<br>挂钩：任务抢占用 SKIP LOCKED（数据库悲观锁语义），文档状态流转用状态机条件更新（乐观）。", "cat": "八股·Java"}, {"q": "Q26： heavily 简答题：Java 21 的虚拟线程是什么？", "a": "平台线程一对一映射 OS 线程（贵，几千个就到顶）；虚拟线程由 JVM 调度、百万级可建，阻塞时自动让出——高并发 IO 密集场景（我的系统全是 IO 密集：DB/ES/LLM 调用）大幅降低线程成本。JDK21 正式发布，我是真用上了的。", "cat": "八股·Java"}, {"q": "Q27：深拷贝浅拷贝？", "a": "浅拷贝只复制引用（两层共用内部对象）；深拷贝连内部对象一起复制。实现：手写递归/序列化 round-trip。", "cat": "八股·Java"}, {"q": "Q28：equals 相等的两个对象 hashCode 一定相等吗？", "a": "规范要求必须相等（否则 HashMap 坏掉）；反之 hashCode 相等 equals 不一定相等（哈希冲突）。", "cat": "八股·Java"}, {"q": "Q29：什么是函数式接口 / Stream？", "a": "单抽象方法接口（@FunctionalInterface），配合 Lambda 用；Stream 是声明式集合处理（filter/map/reduce），惰性求值。<br>挂钩：我代码里 Stream 处理分片列表、按状态分组计数随处可见；追问&quot;Stream 和 for 循环哪个快&quot;→ 差距通常可忽略，可读性优先；大集合且逻辑简单时 for 更直白。", "cat": "八股·Java"}, {"q": "Q30：注解是怎么工作的？", "a": "元数据标记，本身无逻辑；运行期被框架反射读取后执行逻辑（Spring 的 @Autowired/@Transactional 都这样）。<br>追问：@Transactional 什么时候失效？→ 自调用（同类内部 this 调用不走代理）、非 public 方法、异常被 catch 吞掉、默认只回滚 RuntimeException——这题和 Spring 事务连着考，见下篇。", "cat": "八股·Java"}, {"q": "Q31：值传递还是引用传递？", "a": "Java 只有值传递：传对象时传的是&quot;引用的拷贝&quot;——方法内能改对象内容，不能让原引用指向新对象。", "cat": "八股·Java"}, {"q": "Q32：泛型的类型擦除？", "a": "泛型只在编译期检查，运行时擦除为 Object/上界——所以 `List&lt;String&gt;` 和 `List&lt;Integer&gt;` 运行时是同一个类；无法 new T()。", "cat": "八股·Java"}, {"q": "Q33：IO 模型：BIO/NIO/AIO？", "a": "BIO=一连接一线程，阻塞等（人少可以，人多线程爆炸）；NIO=多路复用（一个线程盯一万个连接，就绪才处理）；AIO=异步完成通知。<br>挂钩：我大量 HTTP 调用（ES/LLM/MinIO）用 JDK HttpClient 异步接口；SSE 推流本质也是 IO 复用场景。", "cat": "八股·Java"}, {"q": "Q34：什么情况下会出现内存泄漏？（结合项目答）", "a": "静态集合只增不减、ThreadLocal 不 remove、连接/流未关闭、无界缓存。<br>挂钩：我的 RedisChunkCacheService（进程内 LRU+TTL）就是&quot;有界缓存&quot;设计——上限+过期，防止缓存本身成为泄漏源；这也回答了&quot;为什么叫 Redis 名字却没用 Redis&quot;的诚实设计。", "cat": "八股·Java"}, {"q": "Q35：Comparable 和 Comparator？", "a": "Comparable=类自己实现&quot;自然排序&quot;（compareTo）；Comparator=外部排序规则（可多个、可按需组合）。", "cat": "八股·Java"}, {"q": "Q36：String、StringBuilder、StringBuffer？", "a": "String 不可变；StringBuilder 可变非线程安全（单线程拼接首选）；StringBuffer=StringBuilder+ synchronized（基本不用了）。", "cat": "八股·Java"}, {"q": "Q37：什么是 B/S、C/S？前后端分离的好处？", "a": "B/S=浏览器/服务器（本项目）；前后端分离=接口契约先行，两端独立开发独立部署。<br>挂钩：我的前端 Vite 代理关缓冲是分离架构下的典型联调问题。", "cat": "八股·Java"}, {"q": "Q38：如何设计一个不可变类？", "a": "类 final、字段 private final、不提供 setter、可变字段的 getter 返回拷贝。好处：天然线程安全、可放心当 HashMap key。", "cat": "八股·Java"}, {"q": "Q39：枚举实现单例为什么最好？", "a": "防反射（JVM 禁止反射创建枚举）、防序列化破坏、写法最简——《Effective Java》推荐。", "cat": "八股·Java"}, {"q": "Q40：重载和重写？", "a": "重载=同类同名不同参（编译期）；重写=子类覆盖父类方法（运行期多态）。", "cat": "八股·Java"}, {"q": "Q41：什么是类加载机制？双亲委派？", "a": "加载→验证→准备→解析→初始化；双亲委派=先问父亲加载器要，要不到自己才加载——防核心类被篡改（自己写个 java.lang.String 不会生效）。", "cat": "八股·Java"}, {"q": "Q42：接口里能有什么？default 方法解决什么？", "a": "常量+抽象方法+default+static+private 方法（JDK9+）；default 让接口可以演进而不断裂实现类。", "cat": "八股·Java"}, {"q": "Q1：IOC 是什么？（必考 Top1）", "a": "Inversion of Control 控制反转：对象的创建和依赖装配交给容器（Spring），你只声明&quot;我需要什么&quot;（@Autowired/@RequiredArgsConstructor），不用自己 new。<br>类比：以前自己买菜做饭（自己 new 依赖），现在点外卖（容器把做好的饭递给你），你只管声明&quot;我要吃什么&quot;。<br>追问：好处？→ 解耦（换实现只改配置）、可测试（注入 mock）、生命周期统一管理。<br>挂钩：我的 Service 全部构造器注入——测试里可以轻易塞 mock 依赖，1646 个测试就是靠这个才能海量铺开。", "cat": "八股·框架与存储"}, {"q": "Q2：AOP 是什么？项目中哪里用了？", "a": "Aspect Oriented Programming 面向切面：把&quot;横向贯穿多个业务的方法&quot;（日志、权限、事务、限流）抽成切面，用动态代理织入，业务代码保持干净。<br>类比：小区统一装监控（切面），不用每家自己装摄像头。<br><b>项目挂钩（强）</b>：权限门禁（DocumentRoleGate/财务校验）、操作日志、限流都是切面/拦截器实现——业务方法里几乎看不到权限代码，但处处都在被校验。<br>追问：JDK 动态代理和 CGLIB？→ 有接口用 JDK（实现同一接口），无接口用 CGLIB（生成子类）。Spring Boot 默认 CGLIB。", "cat": "八股·框架与存储"}, {"q": "Q3：Spring Bean 的生命周期？（一句话版+展开版）", "a": "一句话：实例化→属性注入→初始化（ Aware→BeanPostProcessor 前置→InitializingBean/init-method→后置）→使用→销毁。<br>展开亮点：AOP 代理对象在初始化后置阶段生成；面试能说出 BeanPostProcessor 这一层就超过多数人。", "cat": "八股·框架与存储"}, {"q": "Q4：Spring 事务什么时候失效？（必考 Top3）", "a": "①<b>同类自调用</b>（this 调用不走代理，最常见）②方法非 public ③异常被 try/catch 吞掉 ④默认只回滚 RuntimeException（受检异常要 rollbackFor）⑤多线程调用（事务绑定线程）⑥存储引擎不支持（MyISAM）。<br>类比：保险条款的免责清单——每一条都真实坑过人。<br>追问：自调用怎么解决？→ 拆到另一个 Bean、或注入自身代理（AopContext）。<br>挂钩：我的文档 ETL 事务边界在面试里是重点——任务领取（SKIP LOCKED）和业务处理是两个事务，&quot;先领单再干活&quot;天然隔离。", "cat": "八股·框架与存储"}, {"q": "Q5：事务传播行为 REQUIRED 和 REQUIRES_NEW？", "a": "REQUIRED（默认）：有事务就加入，没有就新建；REQUIRES_NEW：挂起当前事务，开一个全新的——内层提交/回滚不影响外层。<br>场景：主流程失败回滚，但&quot;操作日志&quot;必须留下 → 日志方法用 REQUIRES_NEW。<br>追问：嵌套事务部分回滚怎么办？→ savepoint（NESTED）。", "cat": "八股·框架与存储"}, {"q": "Q6：Spring Boot 自动装配原理？（一句话+展开）", "a": "一句话：@SpringBootApplication 里的 @EnableAutoConfiguration 通过 SPI（spring.factories/AutoConfiguration.imports）加载一堆候选配置类，按 @ConditionalOnClass/@ConditionalOnProperty 等条件筛选后自动注册 Bean。<br>类比：插上电源（引入 starter）电器自动就位，不需要逐个接线。<br>挂钩：我写过一个教科书级案例——ProductionConfigGuard 用 spring.factories 注册 EnvironmentPostProcessor（比自动装配更早执行的扩展点），这正是&quot;懂原理的人才会用&quot;的姿势。<br>追问：怎么排除某个自动配置？→ exclude 或条件属性。", "cat": "八股·框架与存储"}, {"q": "Q7：@Autowired 和 @Resource？", "a": "@Autowired 是 Spring 的，按类型注入（多个候选配 @Primary/@Qualifier）；@Resource 是 JDK 的，先按名字再按类型。", "cat": "八股·框架与存储"}, {"q": "Q8：Bean 的作用域？", "a": "singleton（默认，容器一份）、prototype（每次新造）、request/session/websocket（web 场景）。<br>追问：singleton Bean 里的成员变量线程安全吗？→ 不安全！无状态是 Service 的默认约定——我的 Service 全部无状态（状态进 DB/缓存），这就是为什么并发安全。", "cat": "八股·框架与存储"}, {"q": "Q9：@Transactional 底层怎么实现的？", "a": "AOP 动态代理：方法前后开启/提交/回滚连接（TransactionManager），本质是把&quot;事务边界&quot;从业务代码里抽出来。", "cat": "八股·框架与存储"}, {"q": "Q10：Spring MVC 请求处理流程？", "a": "DispatcherServlet 统一收口→HandlerMapping 找到 Controller 方法→参数绑定/校验→执行→返回值处理（@ResponseBody 走 HttpMessageConverter 序列化 JSON）→异常走全局处理器。<br>挂钩：我的统一响应 ApiResponse（HTTP 200 + success:false 表业务失败，SSE 除外）就是在这层约定的。<br><br><b>B. MyBatis</b>", "cat": "八股·框架与存储"}, {"q": "Q11：#{} 和 ${} 的区别？（安全必考）", "a": "`#{}` 预编译占位符（值被参数化，防 SQL 注入）；`${}` 字符串拼接（有注入风险，只用于表名/排序字段等白名单受控场景）。<br><b>挂钩</b>：防注入在我系统里是&quot;权限 fail-closed&quot;同级别的红线——结构化查询的参数由服务端生成，绝不信任模型产出的 SQL。<br>追问：排序字段必须拼接怎么办？→ 白名单映射（合法值才允许替换）。", "cat": "八股·框架与存储"}, {"q": "Q12：MyBatis 的一级/二级缓存？", "a": "一级缓存 SqlSession 级（默认开，同会话相同查询直接命中）；二级缓存 namespace 级（跨会话，慎用——更新频繁时脏读风险高）。生产上更常用 Redis/进程内缓存自己做，可控。<br>挂钩：我的缓存是自管的有界 LRU+TTL，写路径强制失效——比依赖 ORM 缓存可控。", "cat": "八股·框架与存储"}, {"q": "Q13：MyBatis 怎么防止 SQL 注入之外，分页怎么做的？", "a": "物理分页（LIMIT offset,size，PageHelper 插件改写 SQL）而非逻辑分页（查全量再截取——大表会死）。<br>挂钩：文档列表/薪酬分页全是物理分页。<br><br><b>C. MySQL（重点）</b>", "cat": "八股·框架与存储"}, {"q": "Q14：为什么用 B+ 树做索引？（必考 Top1）", "a": "对比：哈希表=等值快但<b>不支持范围查询</b>；二叉树/红黑树=树太高（千万数据 20+ 层，每层一次磁盘 IO）；B+ 树矮胖（3-4 层装千万行），且<b>数据全在叶子节点并用链表串起来</b>——范围查询（between/orderBy）顺链表扫即可。<br>类比：书目录（章节页码集中在目录，正文按页码连续排），而不是每页都标&quot;下一章在第 x 页&quot;。<br>追问：B 树和 B+ 树区别？→ B 树数据在所有节点（非叶子也要存数据，单层装得少→更高），范围查询要中序遍历。", "cat": "八股·框架与存储"}, {"q": "Q15：聚簇索引和二级索引？什么是回表？", "a": "InnoDB 主键索引即数据本身（叶子存整行）=聚簇索引；二级索引叶子存的是<b>主键值</b>——用二级索引查非索引列，要先拿到主键再回聚簇索引查整行=回表。<br>优化：查询列全在索引里就不回表=<b>覆盖索引</b>（explain 的 Extra 显示 Using index）。<br>追问：为什么主键推荐自增？→ 顺序插入不分裂页；用 UUID 当主键会随机插入导致页分裂+缓存不友好。（面试官若追问&quot;那你项目为什么用 UUID 存文档ID&quot;→ 任务幂等键用确定性 UUID 是业务幂等设计，与库自增主键分属两回事——能区分这两个概念本身就加分。）", "cat": "八股·框架与存储"}, {"q": "Q16：最左前缀原则？", "a": "联合索引 (a,b,c) 相当于按 a、(a,b)、(a,b,c) 排序的三个索引——查询必须从最左列开始连续命中；遇到范围查询后面的列失效。<br>类比：字典先按姓氏再按名排序——查&quot;全部姓李的&quot;很快，查&quot;名叫强的不分姓&quot;只能全书翻。<br>追问：(a,b,c) 索引，where b=1 能用吗？→ 不能（跳过了 a）。", "cat": "八股·框架与存储"}, {"q": "Q17：索引失效的常见场景？（必考）", "a": "对索引列做函数/运算（`where YEAR(create_time)=2026`）、隐式类型转换（字符串列传数字）、前导模糊 `like &#x27;%xx&#x27;`、or 两侧有非索引列、优化器判定回表太多不如全表扫。<br>排查工具：EXPLAIN 看 type（ALL=全表扫）、key、rows、Extra。<br>挂钩：我的薪酬报表查询就在&quot;回表太多不如全扫&quot;上做过取舍——EXPLAIN 决策，不是拍脑袋。", "cat": "八股·框架与存储"}, {"q": "Q18：事务 ACID 与隔离级别？（必考 Top3）", "a": "ACID：原子性（undo log 回滚）、一致性（目的）、隔离性（锁+MVCC）、持久性（redo log）。<br>隔离级别：读未提交（脏读）→ 读已提交 RC（不可重复读）→ <b>可重复读 RR（MySQL 默认，解决不可重复读+间隙锁基本解决幻读）</b> → 串行化。<br>类比：四档&quot;你能看到别人没提交的改动&quot;的严格程度。", "cat": "八股·框架与存储"}, {"q": "Q19：MVCC 是什么？（一句话+展开）", "a": "多版本并发控制：每行藏着 trx_id（最近改它的事务）和回滚指针，读时按 ReadView（活跃事务快照）选&quot;对我可见的那个版本&quot;——实现&quot;读写不互相阻塞&quot;。RC 每次读生成新 ReadView，RR 复用第一次的（所以可重复读）。<br>追问：RR 下幻读彻底解决了吗？→ 快照读基本解决，当前读（for update）靠间隙锁。", "cat": "八股·框架与存储"}, {"q": "Q20：redo log / undo log / binlog 的区别？", "a": "redo=物理日志，崩溃恢复用（持久性）；undo=旧值，回滚+MVCC 用（原子性）；binlog=Server 层逻辑日志，主从复制/数据恢复用。<br>类比：redo=草稿纸上的修改笔迹，undo=橡皮擦前的备份，binlog=发 给同事的变更通知。", "cat": "八股·框架与存储"}, {"q": "Q21：慢查询怎么排查？", "a": "①slow_query_log 抓慢 SQL →②EXPLAIN 分析（type/key/rows/Extra）→③对症：缺索引/索引失效/回表过多/深分页 →④改写或加索引 →⑤上线前后对比耗时。<br>挂钩：深分页优化（limit 100000,20 → 游标/子查询定位 id）在薪酬报表场景真做过取舍。", "cat": "八股·框架与存储"}, {"q": "Q22：大表（千万级）怎么办？", "a": "先索引与 SQL 优化 → 读写分离（主从，binlog 复制）→ 分库分表（按时间/按租户 sharding，代价是跨片查询和分布式事务）→ 冷热分离（历史数据归档）。<br>诚实边界：我做过方案级理解+单表千万内的优化实践，分库分表未实际操作过——这是常见追问，照实说+展示方法论。", "cat": "八股·框架与存储"}, {"q": "Q23：乐观锁悲观锁在 MySQL 里怎么写？", "a": "悲观：`select ... for update`（行锁，事务内）。乐观：`update t set x=?, version=version+1 where id=? and version=?`，影响行数=0 说明被人改过。<br>挂钩：任务领取用 SKIP LOCKED（悲观，防止两人领同一单）；文档状态机流转用条件更新（乐观）。", "cat": "八股·框架与存储"}, {"q": "Q24：count(*) / count(1) / count(列)？", "a": "count(*)≈count(1)（MySQL 优化过，走最小索引），count(列) 不算 NULL 所以语义不同。大表 count 慢→单独计数表或估算。", "cat": "八股·框架与存储"}, {"q": "Q25：drop/delete/truncate？", "a": "delete 逐行删可回滚可带 where；truncate 清全表快且重置自增不可回滚；drop 连表删。<br><br><b>D. Redis（概念+诚实设计）</b>", "cat": "八股·框架与存储"}, {"q": "Q26：Redis 为什么快？", "a": "①纯内存 ②单线程无锁竞争（6.0 后网络 IO 多线程）③IO 多路复用 ④高效数据结构（SDS/跳表/压缩列表）。<br>类比：一个超熟练的柜台员（单线程）+ 叫号系统（多路复用），比十个人抢一个账本快。", "cat": "八股·框架与存储"}, {"q": "Q27：Redis 常用数据结构及场景？", "a": "String（缓存/计数器/分布式锁 setnx）、Hash（对象字段级存取）、List（队列/最新列表）、Set（去重/共同好友）、ZSet（排行榜/延迟队列——score 存执行时间）。", "cat": "八股·框架与存储"}, {"q": "Q28：缓存穿透/击穿/雪崩？（必考 Top3，一句话区分）", "a": "穿透=查<b>不存在</b>的数据，缓存永远挡不住（打穿到 DB）→ 解法：布隆过滤器/空值短缓存/参数校验。<br>击穿=一个<b>热点 key 过期瞬间</b>，海量并发直击 DB → 解法：互斥锁重建/逻辑过期/热点永不过期。<br>雪崩=<b>大批 key 同时过期</b>或 Redis 宕机 → 解法：过期时间加随机抖动/多级缓存/集群高可用。<br>类比：穿透=查无此人天天问；击穿=爆款秒杀门口挤爆；雪崩=整排店铺同时下班。", "cat": "八股·框架与存储"}, {"q": "Q29：Redis 持久化 RDB 和 AOF？", "a": "RDB=定期快照（快、恢复快、可能丢最近数据）；AOF=追加写命令日志（丢得少、文件大、恢复慢）；4.0+ 混合持久化=RDB 底+AOF 增量。<br>追问：你们项目 Redis 存什么？→ <b>诚实王牌</b>：语义上的&quot;Redis 缓存&quot;实际实现是进程内有界 LRU+TTL（RedisChunkCacheService），量级不需要独立 Redis——诚实设计比堆中间件加分，README 里也写明了。", "cat": "八股·框架与存储"}, {"q": "Q30：Redis 分布式锁怎么实现？坑？", "a": "`SET key value NX EX 30`（原子加锁+过期）+ value 存唯一标识，解锁用 Lua 校验&quot;是我的锁才删&quot;（防误删别人的）。坑：业务超时锁先过期（看门狗续期，Redisson）；主从切换锁丢失（RedLock 争议/接受小概率）。<br>挂钩：单机部署下我用 JVM 锁+数据库约束兜底；分布式化时这题直接对应&quot;多 worker 任务抢占&quot;——我用的 SKIP LOCKED 就是数据库层分布式锁的等价物。", "cat": "八股·框架与存储"}, {"q": "Q31：缓存与数据库一致性怎么保证？", "a": "常规：先更新 DB，再删缓存（Cache Aside），失败靠过期时间兜底；强一致要订阅 binlog 延迟双删——复杂度高，先问&quot;需要强一致吗&quot;。<br>挂钩：excel 写路径&quot;更新 DB 后强制失效 chunk 缓存&quot;是硬规则（写代码时写死）。", "cat": "八股·框架与存储"}, {"q": "Q32：过期策略与淘汰策略？", "a": "过期删除=惰性+定期抽样；内存满时淘汰策略=常用 allkeys-lru（ Least Recently Used）。<br>挂钩：我的进程内缓存就是 LRU+TTL 的 Java 版——原理同源，能画等号。<br><br><b>E. 网络与 Web</b>", "cat": "八股·框架与存储"}, {"q": "Q33：TCP 三次握手，为什么不是两次？（必考）", "a": "SYN → SYN+ACK → ACK。三次确保&quot;双方都确认了对方的收发能力&quot;；两次会因历史重复连接请求（网络中迷路的旧 SYN）白白建立无效连接。<br>四次挥手=双向各关一次（FIN/ACK×2）；TIME_WAIT 等待 2MSL 确保最后的 ACK 达到+旧报文消亡。", "cat": "八股·框架与存储"}, {"q": "Q34：HTTP 和 HTTPS？HTTPS 握手过程？", "a": "HTTPS=HTTP+TLS：①客户端发随机数+支持的加密套件 ②服务器回证书（含公钥）③客户端验证证书（CA 链）→ 双方用随机数+预主密钥算出<b>对称会话密钥</b> ④之后用对称加密通信。<br>类比：非对称加密只是&quot;见面时安全交换暗号&quot;，之后大量通信用快的对称加密。", "cat": "八股·框架与存储"}, {"q": "Q35：HTTP 1.1 / 2 的区别？", "a": "1.1=长连接（keep-alive）+管线化但队头阻塞；2=二进制分帧+多路复用（一个连接并行多条流）+头部压缩+服务器推送。", "cat": "八股·框架与存储"}, {"q": "Q36：常见状态码？", "a": "200 成功；301/302 重定向；400 参数错；401 未认证（没登录/token 失效）；403 已认证但无权限；404 不存在；409 冲突（我项目的取消已完成导出就返回 409）；429 限流；500 服务器内部错；502/504 网关错（上游挂了——Agnes 挂时我看到的真实状态码）。", "cat": "八股·框架与存储"}, {"q": "Q37：SSE 和 WebSocket 的区别？为什么问答用 SSE？（项目强挂钩）", "a": "SSE=服务器→客户端单向流，基于 HTTP，自动重连，轻；WebSocket=全双工，需要协议升级（101）。<br>选择依据：问答流是&quot;服务器单向推&quot;，SSE 够用且更轻；表格协同需要双向（编辑广播+cursor）才上 WebSocket+STOMP。<br>追问：SSE 怎么防代理缓冲？→ 关 proxy_buffering（我前端 Vite 代理真实踩过）。", "cat": "八股·框架与存储"}, {"q": "Q38：跨域是什么？怎么解决？", "a": "浏览器同源策略：协议/域名/端口任一不同即跨域。解法：CORS 响应头（Access-Control-Allow-Origin）/网关统一配置/开发期代理。预检请求 OPTIONS。<br>挂钩：我的前后端分离+Vite 代理在开发期就是代理方案。", "cat": "八股·框架与存储"}, {"q": "Q39：从输入 URL 到页面显示发生了什么？（经典串联题）", "a": "DNS 解析→TCP 三次握手→（HTTPS 则 TLS 握手）→发 HTTP 请求→（网关→负载均衡→服务→DB/缓存）→响应 HTML→浏览器解析渲染（DOM/CSSOM/JS）→后续 API 请求。<br>答这题的正确姿势：挑 2-3 段展开讲深（比如 TLS 或渲染），展示理解而不是背流程图。", "cat": "八股·框架与存储"}, {"q": "Q40：Session vs JWT？（项目强挂钩）", "a": "Session=服务端存状态，Cookie 放 sessionID（集中式，天然可吊销）；JWT=令牌自带签名信息，服务端无状态（水平扩展友好，但吊销难）。<br>我的双 token 设计：accessToken 短命（30 分钟，泄露窗口小）+ refreshToken 长命（14 天，HttpOnly Cookie 防 XSS，服务端可吊销）——&quot;JWT 吊销难&quot;的业界标准解法就是给 refresh 加服务端状态。<br>追问：并发 401 怎么办？→ 前端刷新防抖，等新 token 后重放请求。", "cat": "八股·框架与存储"}, {"q": "Q1：CAP 定理？", "a": "C 一致性、A 可用性、P 分区容错性——网络分区（P）在分布式系统里不可选择，所以实际是在 <b>C 和 A 之间取舍</b>：CP（ZooKeeper/etcd，分区时拒绝服务保一致）vs AP（Eureka/Redis 集群，分区时可用但可能读到旧值）。<br>类比：断网时你选&quot;宁可不营业也不能卖错&quot;（CP）还是&quot;先卖着回头对账&quot;（AP）。<br>追问：你们项目偏哪边？→ 单体+单库，天然 CP 域内；跨服务场景（未来）按业务选：任务调度 CP、通知 AP。", "cat": "八股·分布式"}, {"q": "Q2：BASE 理论？", "a": "CAP 的 AP 路线的落地哲学：Basically Available（基本可用）、Soft state（软状态/中间态）、Eventually consistent（最终一致）。<br>类比：转账时显示&quot;处理中&quot;（软状态），几秒后一定到账（最终一致）。<br>挂钩：任务状态 QUEUED/RUNNING/SUCCEEDED 就是软状态的教科书案例。", "cat": "八股·分布式"}, {"q": "Q3：一致性哈希？", "a": "普通取模在扩容时几乎全部 key 要搬家；一致性哈希把节点和 key 放到一个环上，key 顺时针找第一个节点——<b>扩缩容只影响相邻段</b>。虚拟节点解决数据倾斜。<br>追问：Redis Cluster 用的不是一致性哈希，是哈希槽（16384 槽分配到节点），本质都是&quot;减少搬迁&quot;。", "cat": "八股·分布式"}, {"q": "Q4：什么是分布式事务？几种方案？", "a": "跨多个服务/库的事务。方案：①2PC/XA（强一致，同步阻塞，重）②TCC（Try-Confirm-Cancel，业务侵入大）③本地消息表/事务消息（最终一致，<b>最常用</b>）④Saga（长流程，每步配补偿）。<br><b>挂钩</b>：我的本地消息表（Outbox）就是方案③——业务和事件同事务落库，后台投递+对账。<br>追问：为什么不用 2PC？→ 同步阻塞吞吐差，多数业务接受最终一致。", "cat": "八股·分布式"}, {"q": "Q5：raft/paxos 一句话？", "a": "分布式共识算法：多数派投票选主/决定值。raft 易懂：Leader 选举 + 日志复制 + 安全性。etcd（K8s 底座）用的就是 raft。<br>诚实边界：概念级理解，未实现过——&quot;我读过 raft 可视化网站，能讲清楚选主流程&quot;。", "cat": "八股·分布式"}, {"q": "Q6：分布式锁的完整方案？（衔接八股下篇 Q30）", "a": "DB 唯一约束（最简单可靠）→ Redis setnx+续期 → ZooKeeper 临时顺序节点（会话断自动释放）。<br><b>挂钩</b>：我的多 worker 抢占没有用&quot;锁服务&quot;，用的是 SKIP LOCKED——数据库行锁天然解决&quot;同一任务不被两个 worker 拿&quot;，这是&quot;能不加组件就不加&quot;的选型观。", "cat": "八股·分布式"}, {"q": "Q7：幂等、重试、超时——分布式三件套的完整关系？", "a": "超时=不确定成功失败 → 重试=拿到确定结果 → 但重试会重复执行 → 所以<b>接口必须幂等</b>。三件套是一个整体设计而非三个独立功能。<br><b>挂钩</b>：我的项目全套齐：HTTP 超时（5s ES/120s 上传）→ 队列退避重试（5/15min 两档）→ 幂等三重保障（先清后建+确定性 UUID+幂等键）。", "cat": "八股·分布式"}, {"q": "Q8：什么是服务雪崩？怎么防？", "a": "A 服务挂 → 调用它的 B 请求堆积占满线程 → B 也挂 → 雪崩。防：超时（快速失败）、限流、熔断（失败率超阈值直接拒绝一段时间）、降级（返回兜底数据）。<br>类比：保险丝：电流过大先断自己，保住电网。<br>挂钩：我项目的三级降级（BGE 精排层）就是熔断+降级的具体实现。", "cat": "八股·分布式"}, {"q": "Q9：消息队列的选型对比？", "a": "RabbitMQ（低延迟、路由灵活、吞吐中等）、Kafka（高吞吐、日志流、消费组）、RocketMQ（事务消息/延迟消息内置）。<br>选型口径（背熟）：<b>量级 + 运维能力 + 需要什么特性</b>。我项目&quot;日均几百任务&quot;选 PG 队列，讲的是同一套逻辑。", "cat": "八股·分布式"}, {"q": "Q10：什么是 eventual consistency 的\"读己之写\"？", "a": "用户自己写入的数据自己立刻要能看到（其他用户可以晚一点）——实现：读走主库/加版本戳路由。<br>场景：改完密码立刻用新密码登录（refresh token 轮换正是这个场景的实现细节）。<br><br><b>B. 系统设计（口头方案题）</b>", "cat": "八股·分布式"}, {"q": "Q11：设计一个\"每天百万请求的短链服务\"？（衔接手写题集 D1）", "a": "容量估算先行：1 亿新链/年 → 发号器（雪花/号段）→ base62 6 位；读写比 100:1 → 读加缓存；301 vs 302 按统计需求；热点 key 缓存击穿→永不过期+布隆。<br>回答模板：容量→存储→缓存→跳转语义→监控。", "cat": "八股·分布式"}, {"q": "Q12：设计一个\"任务调度系统\"？（你项目的原题）", "a": "直接拿项目答：任务表（幂等键/job_type/状态机）→ SKIP LOCKED 抢占 → 租约 → 退避+死信 → 恢复 Runner → 队列深度指标 → 同库事务一致性。<br><b>这是你的主场题</b>：每一个细节都是真实跑过的，主动展开。", "cat": "八股·分布式"}, {"q": "Q13：怎么设计\"秒杀\"？", "a": "（手写题集 D3 完整版）层层过滤：前端削峰→网关限流→Redis 预扣→MQ 异步→DB 终扣；唯一索引防超卖；对账兜底。", "cat": "八股·分布式"}, {"q": "Q14：缓存和数据库的一致性方案演进？", "a": "Cache Aside（先更库再删缓存）→ 延迟双删 → binlog 订阅（Canal）异步删 → 强一致场景直接不用缓存。<br>先反问&quot;需要强一致吗&quot;——多数业务最终一致够用。", "cat": "八股·分布式"}, {"q": "Q15：设计一个支持 10 万并发的 SSE 推送？", "a": "连接管理独立成推送网关（长连接服务），业务服务器只投递消息到网关；心跳保活+断线重连+消息序号（重连补拉）；连接数 = 每网关内存与 fd 上限，水平扩网关+一致性哈希路由用户。<br>挂钩：我项目的 SSE 在应用内——&quot;拆出独立推送网关&quot;就是它规模化的下一步，能画出这个演进图是加分。", "cat": "八股·分布式"}, {"q": "Q16：如何设计权限系统支撑\"多租户+群组+文档\"三层？", "a": "直接拿项目答：用户→群组（角色 owner/editor/viewer）→文档（DocumentRoleGate 独立门）→财务域独立校验。判定顺序 显式&gt;继承&gt;默认拒绝，fail-closed。<br>追问：性能？→ 权限判定加缓存+变更时批量失效；越权返回与&quot;不存在&quot;一致（防枚举）。", "cat": "八股·分布式"}, {"q": "Q17：LLM 应用的成本与限流怎么设计？（AI 岗特色题）", "a": "量测（每次调用 token/费用落库）→ 预算（按用户/天配额，超 429）→ 降本（缓存重复问题/短上下文压缩/小模型路由简单任务）→ 监控（成功率/延迟/成本三线）。<br><b>挂钩</b>：我的使用统计页（252 次/41.2 万 token/¥0.35）就是这套的雏形——AI 应用开发岗问成本，这题是你和纯 Java 候选人拉开差距的地方。", "cat": "八股·分布式"}, {"q": "Q18：如何设计\"评测驱动的 AI 迭代流程\"？", "a": "基线集（准确率/拒答）→ 每次参数/提示词变更必须过评测 → 压力集验证稳定性 → badcase 回流进评测集。<br><b>挂钩</b>：这套流程是项目最独特的部分——大多数候选人讲 RAG 只讲链路不讲&quot;怎么知道它变好还是变坏&quot;。", "cat": "八股·分布式"}, {"q": "Q19：主从延迟怎么处理？", "a": "从库读导致&quot;写后读不到&quot;：①关键读走主库 ②写后短窗口内路由主库 ③监控延迟值，超阈值报警。<br>诚实边界：单库实践，方案级理解。", "cat": "八股·分布式"}, {"q": "Q20：什么是优雅停机？", "a": "停机前：停止接新请求 → 等存量请求处理完（超时上限）→ 清理资源（flush/关闭连接池）。K8s preStop hook。<br>挂钩：我的 worker 停机靠中断标志+任务租约回收——&quot;停机不丢任务&quot;是设计出来的。", "cat": "八股·分布式"}, {"q": "Q21：什么是幂等设计的数据层兜底？", "a": "应用层幂等（查重/锁）都可能被并发击穿，<b>数据库唯一索引是最后防线</b>——重复插入直接报错被捕获转为幂等语义。<br>挂钩：分享 token/收藏/任务键全部唯一索引兜底。", "cat": "八股·分布式"}, {"q": "Q22：如何做灰度发布的效果对比？", "a": "灰度组 vs 对照组，指标（错误率/延迟/业务转化）显著差异才放量；AI 功能加评测集双跑。<br>挂钩：精排 ON/OFF 的评测对比就是这个方法（NoOp 基线 97.6% 就是对照组数据）。", "cat": "八股·分布式"}, {"q": "Q23：如果让你重构一个烂系统，怎么开始？", "a": "框架答：①先加监控和测试（看清现状+建安全网）②梳理依赖画链路图 ③绞杀者模式逐步替换（新功能新模块，旧功能迁一个删一个）④数据双写迁移验证 ⑤不下大爆炸式重写的决心。<br>这套方法论直接展示工程成熟度，被问&quot;你怎么接手遗留代码&quot;也可用。", "cat": "八股·分布式"}, {"q": "Q24：什么是背压（backpressure）？", "a": "消费者处理不过来时，把压力反馈给生产者（限流/降速/缓冲）。SSE/流式场景：LLM 出 token 快、前端渲染慢——缓冲+丢弃心跳+压缩是实际手段。<br>挂钩：流式问答链路里我做过 StreamingParserService 的分块处理，背压是它要处理的现实问题。", "cat": "八股·分布式"}, {"q": "Q25：你怎么理解\"可观测性三支柱\"？", "a": "日志（离散事件，查细节）、指标（聚合数值，看趋势/告警）、链路追踪（跨服务一次请求的完整路径）。三者按&quot;发现→定位&quot;分工。<br>诚实边界：项目里日志+指标齐备，分布式追踪未做（单体不需要）——&quot;单体阶段追踪的收益小于成本&quot;这个判断本身就是答案。", "cat": "八股·分布式"}, {"q": "Q1 自我介绍（1 分钟）", "a": "&gt; 面试官您好，我叫袁晨泰，3 年 Java 开发经验，现在在职做金蝶云苍穹的二开。工作之外我独立做了一个企业级 RAG 知识库平台——从文档解析入库、向量加关键词的双路检索，到 Agent 工具调用、前端协同编辑，全链路是我一个人加 AI 协作完成的，1642 个自动化测试全绿，检索质量有量化评测，综合准确率 95%。我这次看机会，就是想找一个专注做 AI 应用落地的团队。", "cat": "项目·速查29问"}, {"q": "Q2 介绍一下项目（2 分钟）", "a": "&gt; 这个项目解决两个痛点：企业文档散落各处找不到，和 AI 回答问题会瞎编。平台三块：<br>&gt; 第一块，入库。文档上传后不直接处理，先落任务进队列，后台异步解析、清洗、按标题结构切片、向量化，写进 pgvector 和 Elasticsearch。失败自动重试，耗尽进死信，用户能看到人话原因并一键重试。<br>&gt; 第二块，问答，这是核心。提问后先做查询规划，然后 pgvector 语义召回和 ES 关键词召回各取 50 条，RRF 融合，再用 BGE 的 cross-encoder 精排，模型挂了自动降级。证据够就带引用回答，不够就明确拒答。<br>&gt; 第三块，一个 Agent 智能体能调知识库检索、结构化数据查询、联网搜索三个工具；还有在线 Excel 协同编辑。<br>&gt; 质量上：三层权限 fail-closed，1642 个测试全绿，评测综合 95%，拒答准确率 100%。", "cat": "项目·速查29问"}, {"q": "Q3 项目最难的地方？", "a": "&gt; 不是功能，是失败语义。上传后要处理几分钟，这期间服务可能重启、上游可能挂、用户可能重复点。我把失败分层：进程内快速重试、文档置 FAILED 给人话原因、任务队列按分钟退避、耗尽进死信、手动重试用新代数。让每种失败都&quot;用户可理解、系统可恢复&quot;。", "cat": "项目·速查29问"}, {"q": "Q4 为什么双路召回？一路向量不行吗？", "a": "&gt; 不行。向量召回管语义：问&quot;出差住宿怎么报销&quot;能命中&quot;差旅费管理办法&quot;，换个说法也命中。但精确词会糊：制度编号、设备型号转成向量后距离拉不开。ES 关键词召回正好相反。所以互补，各取 50 条用 RRF 合并。<br>&gt; 追问「怎么合并」：RRF 只看名次取倒数求和——两路分数不同量纲没法直接比。追问「k 值」：用 k=0，第一名权重最大。", "cat": "项目·速查29问"}, {"q": "Q5 精排是什么？模型挂了怎么办？", "a": "&gt; 双路召回保证相关的在池子里，但顺序不准。用 BGE 的 cross-encoder 把&quot;问题+文档&quot;成对打分，比间接相似度准。50 对实测 3.5 秒。<br>&gt; 降级：HTTP 非 200、超时、响应异常，一律回退成保持原序的分数，外面还有一层 try-catch。最坏就是排序退回普通水平，问答不受影响。<br>&gt; 追问「为什么不在召回时用」：cross-encoder 每对都要跑模型，几千候选跑不动。所以便宜的召回缩池子，贵的精排排前 50——漏斗设计。", "cat": "项目·速查29问"}, {"q": "Q6 怎么防 AI 瞎编？", "a": "&gt; 两道闸。检索后：证据评估器分级，不足就不调大模型，直接说&quot;证据不足&quot;——超纲题全部正确拒答。生成后：回答强制带引用，能点回原文核对。", "cat": "项目·速查29问"}, {"q": "Q7 检索质量怎么量化？", "a": "&gt; 自建评测：40 题正式集 + 170 题压测集（含干扰语料）。指标：HitRate@5、MRR、要点覆盖率、拒答正确率。结果：100%、100%、95% 综合。每次改检索策略都跑一遍，防止改好一处坏一处。", "cat": "项目·速查29问"}, {"q": "Q8 向量库为什么选 pgvector？", "a": "&gt; 复用 PG 的事务、权限、运维；几十万向量 HNSW 够用；本地 embedding 零成本离线。换 Milvus 的时机：亿级向量或需要独立扩缩容。", "cat": "项目·速查29问"}, {"q": "Q9 切片怎么做的？", "a": "&gt; 结构感知：先识别标题层级，按&quot;标题+管辖内容&quot;切，保证语义完整。目标 240 token、上限 320、重叠 32。硬切会把答案拦腰切断，两半都检索不到。", "cat": "项目·速查29问"}, {"q": "Q10 Agent 怎么实现的？", "a": "&gt; Spring AI Alibaba 的 ReactAgent：模型推理和工具调用循环。三个工具：知识库检索（复用混合检索）、结构化数据查询、联网搜索。短期记忆是会话上下文，长期记忆落库跨会话。", "cat": "项目·速查29问"}, {"q": "Q11 工具调用怎么防越权？", "a": "&gt; 两层：groupId/userId 服务端注入，绝不信任模型参数（防提示词注入）；工具内部再过一遍权限，知识库工具走和问答一样的角色门。fail-closed：拿不准就拒。", "cat": "项目·速查29问"}, {"q": "Q12 为什么查表格不让模型写 SQL？", "a": "&gt; 两个风险：幻觉列名、SQL 注入。改成&quot;列名+运算符+值&quot;的声明式协议，白名单校验，SQL 由代码拼装。模型负责理解意图，不生成危险操作。", "cat": "项目·速查29问"}, {"q": "Q13 为什么用数据库做队列，不用 MQ？", "a": "&gt; ①双写一致性：文档行和任务行同事务提交，MQ 有&quot;业务成功消息丢&quot;的窗口。②量级：百级/天用不上 MQ 吞吐。③语义等价：幂等键、SKIP LOCKED、租约、退避、死信都有，将来迁移平滑。<br>&gt; 追问「SKIP LOCKED」：两个 Worker 同时领任务，跳过已锁的行不等待，保证一条任务只被一个实例领走。", "cat": "项目·速查29问"}, {"q": "Q14 重复点击上传会重复处理吗？", "a": "&gt; 三重防：入队幂等键唯一索引；处理前先清旧产物再建；向量 ID 用文档+块号的确定性 UUID，重跑是覆盖不是新增。at-least-once 队列 + 业务层幂等。", "cat": "项目·速查29问"}, {"q": "Q15 服务重启了，处理一半的文档怎么办？", "a": "&gt; 两层恢复：任务有 5 分钟租约，Worker 崩了租约到期别人自动接管；启动时有恢复器把遗留&quot;处理中&quot;文档置为失败，用户手动重试（新幂等代数，不撞历史）。", "cat": "项目·速查29问"}, {"q": "Q16 权限怎么设计的？", "a": "&gt; 三层 fail-closed：群组成员门 → 文档角色门（不够返回空结果，和查无此文一样，防探测）→ 子资源回溯（sheet/版本/导出回溯到所属文档重新鉴权）。前端守卫只管体验，服务端每层重新校验。", "cat": "项目·速查29问"}, {"q": "Q17 接口突然变慢怎么排查？", "a": "&gt; 真实案例：LLM 供应商抖动导致回答接口大量超时。路径：Prometheus 指标定位阶段 → 日志定位原因 → 发现 Java 侧重试预算 45s×3 超过客户端 120s 超时，级联了。教训：超时预算从用户端往回倒推分配，每层加起来必须小于外层。", "cat": "项目·速查29问"}, {"q": "Q18 死信是什么？", "a": "&gt; 重试三次耗尽进 DEAD_LETTER：不再自动重试，保留完整错误信息。两条出路：修复后同键复活；或对失败文档手动重试（新代数）。价值：让失败可见可控，不在无限重试里消失。", "cat": "项目·速查29问"}, {"q": "Q19 AI 写的代码不可控，怎么保证质量？", "a": "&gt; 我不控制 AI 的错误率，我控制错误逃逸率——四层网：①约束前置：架构红线写进任务上下文（不改迁移、不绕权限、fail-closed）；②测试门禁：1642 个测试是契约，改坏必红；③人工审查：AI 错误率不低，我抓到过路由注册错实例、mock 语法错误，但每层都有网，逃逸率零；④小步提交：单主题提交可单独回退。", "cat": "项目·速查29问"}, {"q": "Q20 怎么给 AI 写有效任务？", "a": "&gt; 四要素：调用链（改哪条路径谁在调）、事务边界、失败路径（每步失败后什么状态）、验证命令（跑什么测试算过）。上下文质量决定产出质量。", "cat": "项目·速查29问"}, {"q": "Q21 为什么用 Java 做 RAG，不用 Python？", "a": "&gt; ①复用：权限、事务、队列都是现成生产级组件。②RAG 难点在工程不在语言：评测、降级、权限、成本，我在 Java 栈全做完了。③LangChain 的概念我动手实现过对应物（loader/splitter/retriever/tool），还用 LangChain 复刻了一遍我的检索链做对照——换框架是搬概念不是学新东西。", "cat": "项目·速查29问"}, {"q": "Q22 现在公司开发流程怎么走的？", "a": "&gt; 【填真实】需求怎么来 → 评审排期 → 开发自测 → 提测 → 发布上线 → 线上问题处理。准备三个真实例子：一个交付物、一次沟通、一次问题处理。", "cat": "项目·速查29问"}, {"q": "Q23 需求老变怎么办？", "a": "&gt; 先评估影响面（设计/排期）→ 和产品对齐优先级 → 变更落文档 → 小步交付降低变更成本。", "cat": "项目·速查29问"}, {"q": "Q24 和同事意见不合怎么办？", "a": "&gt; 先听理由 → 拿数据/测试说话 → 小范围验证 → 服从团队决策保留意见。", "cat": "项目·速查29问"}, {"q": "Q25 线上出过什么事故？", "a": "&gt; 用 LLM 上游抖动案例（Q17）：现象 → 定位 → 根因（超时预算级联）→ 修复思路 → 事后防护。", "cat": "项目·速查29问"}, {"q": "Q26 你的优点缺点？", "a": "&gt; 优点：能把一件事完整做掉——没人要求，我自己定义、交付、量化验收。缺点：细节钻太深——我的办法是定时间盒，先出可用版本再迭代。", "cat": "项目·速查29问"}, {"q": "Q27 你怎么学新技术？", "a": "&gt; 三步：最小例子建立体感 → 核心概念映射到已会的 → 真实项目用一次。我用这套方法从零两周做出了完整 RAG 平台。", "cat": "项目·速查29问"}, {"q": "Q28 为什么招你？", "a": "&gt; 三条：①做过——RAG/Agent 工程不是 demo，有评测有降级有队列语义；②工作方式就是 AI-Native——有整个项目的产出证明；③学得快——基础 Web 到完整 AI 平台的方法可复制。", "cat": "项目·速查29问"}, {"q": "Q29 还有什么想问的？", "a": "&gt; &quot;团队 AI 应用到什么阶段了？我入职第一个月大概做什么？&quot;<br>&gt; &quot;团队怎么用 AI 编程工具？有没有测试和评审门禁？&quot;（引到你的强项）", "cat": "项目·速查29问"}, {"q": "1. SKIP LOCKED 抢单", "a": "• <b>L1</b>：多 worker 怎么保证不重复消费？→ `FOR UPDATE SKIP LOCKED`：事务 A 锁住某行时，B 的查询直接跳过该行拿下一行。<br>• <b>L2</b>：SKIP LOCKED 和 `SELECT ... FOR UPDATE` 普通加锁的区别？→ 普通 FOR UPDATE 会阻塞等锁，worker 互相排队浪费吞吐；SKIP LOCKED 非阻塞跳过，各拿各的，天然负载均衡。<br>• <b>L3</b>：两个事务同时 SKIP LOCKED 会不会有竞态？→ 不会：行锁在 PostgreSQL 是互斥的，同一行同一时刻只有一个事务能 FOR UPDATE 成功；&quot;跳过&quot;读的是锁的可见性，这是数据库层保证，不是应用层约定。<b>追问点</b>：既然行锁就够，为什么要租约？→ 行锁只保护&quot;拿&quot;的瞬间；worker 拿到后崩溃，锁随事务结束释放，任务卡在 RUNNING——租约 5 分钟超时后由恢复 Runner 重新入队。<br>• <b>挂人信号</b>：把 SKIP LOCKED 说成&quot;乐观锁&quot;或&quot;分布式锁&quot;。", "cat": "项目·深挖追问"}, {"q": "2. 租约到期但 worker 还活着", "a": "• <b>L1</b>：租约 5 分钟超时后任务被重新入队，原 worker 还在跑怎么办？→ 会不会双执行？会。所以<b>执行体必须幂等</b>：先清后建（重跑先删该文档旧分片）、确定性 UUID（同一文档每次生成相同 ID 覆盖而非新增）、幂等键防同单写两遍。<br>• <b>L2</b>：为什么不直接&quot;心跳续租&quot;？→ 可以做，但要引入心跳线程和时钟漂移处理；幂等是本来就要有的正确性兜底，有了幂等，双执行只是浪费不算错误——用幂等换掉续租复杂度，量级小时是更便宜的方案。<br>• <b>L3</b>：先清后建在并发下安全吗？→ 同一文档并发重建被幂等键+任务状态机约束：同键任务不会被两个 worker 同时 RUNNING（SKIP LOCKED 抢单保证），所以清+建是单执行者顺序操作。", "cat": "项目·深挖追问"}, {"q": "3. RRF 为什么 k=0", "a": "• <b>L1</b>：双路分数怎么融合？→ RRF：每路按排名给倒数分，`score = Σ 1/(k+rank)`。<br>• <b>L2</b>：为什么不用分数加权？→ BM25 分和余弦相似度量纲不同、分布不同，加权要先归一化且对参数敏感；RRF 只用排名不用分值，免调参、稳健。<br>• <b>L3</b>：k 的作用是什么？为什么这里取 0？→ k 是平滑项，防止头部排名权重过大；k=0 时 score=1/rank，头部更陡，实测对我们的 topK5 截断更友好。<b>关键</b>：这个参数是评测集上对比出来的，不是拍的。", "cat": "项目·深挖追问"}, {"q": "4. 精排 3.47 秒太慢怎么办", "a": "• <b>L1</b>：50 对 cross-encoder 3.47s，用户等得起吗？→ 问答总预算内可接受，且有三层优化空间。<br>• <b>L2</b>：具体怎么优化？→ ①批量推理（50 对一个 batch）；②先截断再精排（50→20 只排头部）；③精排结果缓存；④降级链保底：本地→远程 rerank 端点→NoOp 直接用 RRF 序。<br>• <b>L3</b>：降级了准确率掉多少？→ 评测有数：NoOp 基线 170 例 HitRate@5 97.6%、综合 94.1%，和精排开/关的对比直接量化了&quot;降级损失&quot;——所以敢降。", "cat": "项目·深挖追问"}, {"q": "5. 拒答阈值怎么定的", "a": "• <b>L1</b>：什么时候拒答？→ EvidenceAssessor 评估 topK 证据质量，不足则拒。<br>• <b>L2</b>：阈值怎么调出来的？→ 评测集里专门放了&quot;知识库没有&quot;的问题，要求拒答 100% 命中；阈值卡在&quot;正常问题不误拒&quot;和&quot;无据问题必拒&quot;的边界上，两边都有指标。<br>• <b>L3</b>：用户抱怨&quot;明明有资料却拒答&quot;怎么办？→ 这是召回问题不是阈值问题：先看该 case 的双路召回是否命中（HitRate），命中了被精排挤掉是排序问题，没命中是切片/向量化问题——归因链条清楚，改对应层，而不是全局放宽阈值。", "cat": "项目·深挖追问"}, {"q": "6. 引用怎么保证不错位", "a": "• <b>L1</b>：引用角标和原文怎么对上？→ 分片入库时带 documentId/chunkId/位置，CitationAssembler 在生成后把回答中的引用标记映射回 chunk 记录，前端点开跳原文。<br>• <b>L2</b>：LLM 幻觉编了个不存在的引用编号怎么办？→ 引用映射只认证据集里真实存在的 chunk：编号超出证据集的标记在装配阶段被丢弃，不渲染假引用。<br>• <b>L3</b>：回答内容本身和引用 chunk 不一致呢？→ 这是防幻觉的 prompt 约束（只依据证据作答）+ 评测集抽样核对的组合；工程上做不到 100%，所以引用可回溯本身就是为了让人工抽查成本趋近于零。", "cat": "项目·深挖追问"}, {"q": "7. JWT 双 token 设计", "a": "• <b>L1</b>：为什么双 token？→ accessToken 短命（30 分钟）降低泄露窗口，refreshToken 长命（14 天）换无感续期。<br>• <b>L2</b>：refresh 为什么放 HttpOnly Cookie？→ 防 XSS 偷 token；accessToken 内存持有、随请求头走，泄露面最小。登出后服务端能主动吊销 refresh——纯 JWT 吊销难，所以 refreshToken 才是吊销的抓手。<br>• <b>L3</b>：并发请求同时 401 怎么办？→ 前端刷新要防抖：只发一个 refresh 请求，其余请求挂起等新 token 再重放，避免多请求各自刷新导致部分用旧 token 失败。", "cat": "项目·深挖追问"}, {"q": "8. 越权返回空证据而不是 403", "a": "• <b>L1</b>：为什么越权不报 403？→ 403 等于告诉攻击者&quot;这个 ID 存在，换个 ID 再试&quot;，方便枚举。<br>• <b>L2</b>：返回空会不会影响正常用户的错误感知？→ 会，所以正常流程里&quot;无权&quot;和&quot;不存在&quot;对用户表现一致（都像不存在），这是刻意的安全模糊；真实操作（导出/编辑）则 fail-closed 明确拒绝。<br>• <b>L3</b>：怎么验证防枚举有效？→ 权限测试用例覆盖&quot;越权用户查询他人文档&quot;，断言响应与查不存在文档完全一致。", "cat": "项目·深挖追问"}, {"q": "9. LWW 丢更新怎么办", "a": "• <b>L1</b>：冲突合并用什么？→ LWW，最后写入赢。<br>• <b>L2</b>：两人同时改一个单元格，先写的会丢——能接受吗？→ 单元格粒度下，&quot;覆盖&quot;是用户可理解的语义（Excel 本地也一样）；关键是不丢&quot;别人的其他单元格&quot;。丢更新只在同格同刻发生，概率低且语义明确。<br>• <b>L3</b>：什么时候必须升级成 OT/CRDT？→ 当产品语义要求&quot;合并编辑内容&quot;（如同一段文字协同）时；表格单元格是低粒度原子值，LWW 是复杂度和体验的正确折中——能讲清&quot;为什么不用更高级的方案&quot;比用了更高级的方案更值钱。", "cat": "项目·深挖追问"}, {"q": "10. 切片参数 240/320 怎么定的", "a": "• <b>L1</b>：切片目标 240 token、上限 320、重叠多少？→ 结构感知切片：按标题/段落边界切，参数是这个文档形态下的实测值。<br>• <b>L2</b>：为什么结构感知而不是定长切？→ 定长会把一句话切两半，检索命中半句话，证据不可读；结构感知保证每个切片语义完整，重叠防边界句丢失。<br>• <b>L3</b>：换了文档类型（纯文本/代码）怎么办？→ 参数进配置不进代码，换语料重跑评测集再调——参数是评测的输出，不是输入。", "cat": "项目·深挖追问"}, {"q": "11. 1646 个测试怎么组织的", "a": "• <b>L1</b>：测试怎么跑的？→ `mvn -o test`，1646 个全绿是全量回归的结果。<br>• <b>L2</b>：都测什么层？→ 以服务层单测为主（mock 依赖，测业务语义和失败路径），控制器层测权限与参数校验，关键链路有集成测试；每个修过的 bug 先写失败测试再修（两个 IDOR 都是 TDD 修的）。<br>• <b>L3</b>：测试怎么防&quot;改了 A 坏了 B&quot;？→ 这正是全量回归的意义：AI 协作开发里每次改动跑全量，1646 就是防回归的安全网——没有这个网，AI 的产出速度会变成事故速度。", "cat": "项目·深挖追问"}, {"q": "12. 生产配置防呆的实现原理", "a": "• <b>L1</b>：怎么做到&quot;配置缺失拒绝启动&quot;？→ 自定义 EnvironmentPostProcessor，注册在 spring.factories，早于应用上下文初始化执行。<br>• <b>L2</b>：为什么不用 @Value 校验或 Actuator？→ @Value 太晚——bean 初始化才发现，报错深且可能半初始化；EnvironmentPostProcessor 在环境准备阶段就拦截，报错直达&quot;缺哪个键&quot;。<br>• <b>L3</b>：校验哪些？→ prod profile 下 9 个必填键 + 拒绝值清单（默认密码类）+ JWT 密钥长度 ≥32。<b>追问&quot;本地开发会不会误伤&quot;</b>→ 只对 prod profile 生效，dev 不拦。", "cat": "项目·深挖追问"}];
const KEY = "flashcard-progress-v1";
let state = JSON.parse(localStorage.getItem(KEY) || "{}");
let filter = "全部", shuffled = [...DATA];
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); document.getElementById("done").textContent = Object.values(state).filter(v=>v==="ok").length; }
function catList(){ return ["全部", ...new Set(DATA.map(c=>c.cat))]; }
function render(){
  const list = document.getElementById("list"); list.innerHTML = "";
  let shown = 0;
  shuffled.forEach((c, idx) => {
    if (filter !== "全部" && c.cat !== filter) return;
    shown++;
    const st = state[c.q] || "";
    const div = document.createElement("div");
    div.className = "card" + (st==="ok" ? " open done" : "");
    div.innerHTML = '<div class="q" onclick="toggle(this)"><span>'+c.q+'</span><span class="tag">'+c.cat+'</span></div>'
      + '<div class="a">'+c.a
      + '<div class="btns"><button class="ok" onclick="mark(event,\''+idx+'\',1)">✅ 过关</button>'
      + '<button class="again" onclick="mark(event,\''+idx+'\',2)">🔁 再练</button></div></div>';
    list.appendChild(div);
  });
  document.getElementById("total").textContent = shown;
  save();
}
function toggle(el){ el.parentElement.classList.toggle("open"); }
function mark(e, idx, v){
  e.stopPropagation();
  const c = shuffled[idx];
  state[c.q] = v===1 ? "ok" : "";
  const card = e.target.closest(".card");
  card.classList.toggle("done", v===1);
  save();
}
function renderFilters(){
  const box = document.getElementById("filters"); box.innerHTML = "";
  catList().forEach(cat => {
    const b = document.createElement("button");
    b.className = "fbtn" + (cat===filter ? " on" : "");
    b.textContent = cat;
    b.onclick = () => { filter = cat; renderFilters(); render(); };
    box.appendChild(b);
  });
}
function shuffle(){ shuffled.sort(() => Math.random() - 0.5); render(); }
renderFilters(); render();
</script></body></html>
